name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. sim-test: the always-on gate. Builds and tests the simulation core with
  #    the /sim mirror csproj. Needs no Unity licence. Also verifies that every
  #    asset has a deterministic .meta file and that Core never references
  #    UnityEngine, and compile-checks the Unity layer against API stubs.
  # ---------------------------------------------------------------------------
  sim-test:
    name: sim-test (dotnet, no Unity licence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Meta-file discipline
        run: python3 tools/gen_meta.py --check

      - name: Core must not reference UnityEngine
        run: |
          if grep -rn --include=*.cs -E "UnityEngine|UnityEditor" Assets/Scripts/Core; then
            echo "::error::AlpineSim.Core references UnityEngine/UnityEditor"; exit 1; fi
          echo "Core is engine-free"

      - name: Restore
        run: dotnet restore sim/AlpineSim.Core.Tests.csproj

      - name: Build simulation core
        run: dotnet build sim/AlpineSim.Core.csproj --configuration Release --no-restore

      - name: Test simulation core
        run: dotnet test sim/AlpineSim.Core.Tests.csproj --configuration Release --logger "trx;LogFileName=sim-tests.trx" --results-directory sim/TestResults

      - name: Compile-check Unity layer against API stubs
        run: dotnet build sim/AlpineSim.Unity.CompileCheck.csproj --configuration Release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-test-results
          path: sim/TestResults

  # ---------------------------------------------------------------------------
  # 2. unity-test: EditMode + PlayMode via game-ci. Requires UNITY_LICENSE,
  #    UNITY_EMAIL and UNITY_PASSWORD secrets; skips gracefully when absent.
  # ---------------------------------------------------------------------------
  unity-test:
    name: unity-test (${{ matrix.testMode }})
    runs-on: ubuntu-latest
    needs: sim-test
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check for Unity secrets
        id: secrets
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::notice title=unity-test skipped::UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD secrets are not configured; skipping Unity test run. See README.md 'CI secrets' for setup."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.available == 'true'
        with:
          lfs: false

      - uses: actions/cache@v4
        if: steps.secrets.outputs.available == 'true'
        with:
          path: Library
          key: Library-test-${{ matrix.testMode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-${{ matrix.testMode }}-
            Library-

      - uses: game-ci/unity-test-runner@v4
        if: steps.secrets.outputs.available == 'true'
        id: tests
        with:
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.testMode }} results

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.available == 'true' && always()
        with:
          name: unity-test-results-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}

  # ---------------------------------------------------------------------------
  # 3. build: Windows x86-64 and macOS Universal player builds from the same
  #    commit. Runs on version tags and manual dispatch; skips without secrets.
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.targetPlatform }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: sim-test
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [StandaloneWindows64, StandaloneOSX]
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check for Unity secrets
        id: secrets
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::notice title=build skipped::UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD secrets are not configured; skipping player build for ${{ matrix.targetPlatform }}. See README.md 'CI secrets'."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.available == 'true'

      - name: Free disk space
        if: steps.secrets.outputs.available == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - uses: actions/cache@v4
        if: steps.secrets.outputs.available == 'true'
        with:
          path: Library
          key: Library-build-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-build-${{ matrix.targetPlatform }}-
            Library-

      - uses: game-ci/unity-builder@v4
        if: steps.secrets.outputs.available == 'true'
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: AlpineResortSimulator
          buildMethod: AlpineSim.Editor.BuildScript.Build
          versioning: Tag

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.available == 'true'
        with:
          name: AlpineResortSimulator-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
